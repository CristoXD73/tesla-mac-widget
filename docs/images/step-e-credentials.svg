<svg xmlns="http://www.w3.org/2000/svg" width="760" height="414" viewBox="0 0 760 414">
<style>
 .bg{fill:#ffffff} .title{font:700 26px -apple-system,Helvetica,Arial,sans-serif;fill:#171a20}
 .page{font:600 14px -apple-system,Helvetica,Arial,sans-serif;fill:#3e6ae1}
 .label{font:600 15px -apple-system,Helvetica,Arial,sans-serif;fill:#393c41}
 .value{font:500 16px ui-monospace,Menlo,monospace;fill:#171a20}
 .dim{font:400 15px -apple-system,Helvetica,Arial,sans-serif;fill:#8e8e8e}
 .box{fill:#f4f4f4;stroke:#3e6ae1;stroke-width:2}
 .on{fill:#3e6ae1} .off{fill:#fff;stroke:#c9c9c9;stroke-width:2}
 .tick{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 .note{fill:#fff7e0;stroke:#f2c94c} .notetext{font:500 15px -apple-system,Helvetica,Arial,sans-serif;fill:#5c4500}
</style>
<rect width="760" height="414" rx="14" class="bg" stroke="#e2e2e2"/>
<text x="40" y="34" class="page">PASTE YOUR KEYS · ~/.tesla-widget/credentials.env</text>
<text x="40" y="66" class="title">credentials.env</text>
<text x="40" y="96" class="label">Line 2</text><rect x="40" y="106" width="680" height="44" rx="6" class="box"/><text x="56" y="135" class="value">TESLA_CLIENT_ID=paste-your-client-id-here</text><text x="40" y="178" class="label">Line 3</text><rect x="40" y="188" width="680" height="44" rx="6" class="box"/><text x="56" y="217" class="value">TESLA_CLIENT_SECRET=paste-your-client-secret-here</text><text x="40" y="260" class="label">Line 4</text><rect x="40" y="270" width="680" height="44" rx="6" class="box"/><text x="56" y="299" class="value">TESLA_WEBSITE=YOURNAME.github.io</text><rect x="40" y="342" width="680" height="46" rx="8" class="note"/><text x="56" y="371" class="notetext">💡 Save with ⌘S. The installer already filled in TESLA_WEBSITE.</text>
</svg>