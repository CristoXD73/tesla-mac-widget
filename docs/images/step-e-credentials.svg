<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<style>
 .bg{fill:#ffffff} .title{font:700 26px -apple-system,Helvetica,Arial,sans-serif;fill:#171a20}
 .page{font:600 13px -apple-system,Helvetica,Arial,sans-serif;fill:#5c5e62;letter-spacing:.06em}
 .label{font:600 15px -apple-system,Helvetica,Arial,sans-serif;fill:#393c41}
 .body{font:400 16px -apple-system,Helvetica,Arial,sans-serif;fill:#393c41}
 .value{font:500 16px ui-monospace,Menlo,monospace;fill:#171a20}
 .dim{font:400 15px -apple-system,Helvetica,Arial,sans-serif;fill:#8e8e8e}
 .box{fill:#f4f4f4;stroke:#3e6ae1;stroke-width:2}
 .on{fill:#3e6ae1} .off{fill:#fff;stroke:#c9c9c9;stroke-width:2}
 .tick{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 .note{fill:#f4f6fb;stroke:#d0d7e8} .notetext{font:500 15px -apple-system,Helvetica,Arial,sans-serif;fill:#30333a}
</style>
<rect x=".5" y=".5" width="759" height="419" rx="14" class="bg" stroke="#e2e2e2"/>
<text x="40" y="34" class="page">YOUR TWO CODES</text>
<text x="40" y="66" class="title">~/.tesla-widget/credentials.env</text>
<text x="40" y="96" class="label">From your app's page on developer.tesla.com</text><rect x="40" y="106" width="680" height="44" rx="6" class="box"/><text x="56" y="135" class="value">TESLA_CLIENT_ID=paste-your-client-id</text><text x="40" y="178" class="label">Click the eye icon to reveal it</text><rect x="40" y="188" width="680" height="44" rx="6" class="box"/><text x="56" y="217" class="value">TESLA_CLIENT_SECRET=paste-your-client-secret</text><text x="40" y="260" class="label">Already filled in by the installer</text><rect x="40" y="270" width="680" height="44" rx="6" class="box"/><text x="56" y="299" class="value">TESLA_WEBSITE=yourname.github.io</text><rect x="40" y="348" width="680" height="46" rx="8" class="note"/><text x="56" y="377" class="notetext">Save with ⌘S, then press Reload in the setup window.</text>
</svg>