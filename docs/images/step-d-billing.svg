<rect x=".5" y=".5" width="759" height="225" rx="14" class="bg" stroke="#e2e2e2"/>
<text x="40" y="34" class="page">DEVELOPER.TESLA.COM · PAGE 5 OF 5</text>
<text x="40" y="66" class="title">Billing Details</text>
<text x="40" y="96" class="body">Add a payment method. Tesla gives every developer account a monthly</text><text x="40" y="122" class="body">credit, and the widget is designed to stay under it.</text><rect x="40" y="154" width="680" height="46" rx="8" class="note"/><text x="56" y="183" class="notetext">Apps without a payment method are switched off, even when they cost $0.</text>
